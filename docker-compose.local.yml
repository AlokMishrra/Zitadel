name: zitadel

services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    restart: unless-stopped
    user: "0"
    command: start-from-init --masterkey "jYCXFt5umAbioo2b9IBT6YjyamC8PvyM" --steps /init-steps.yaml
    ports:
      - "8080:8080"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://postgres:postgres@postgres:5432/zitadel?sslmode=disable"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ""
    volumes:
      - ./init-steps-local.yaml:/init-steps.yaml:ro
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 40s
    networks:
      - zitadel
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    networks:
      - zitadel

  custom-ui:
    build: ./custom-ui
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      ZITADEL_ISSUER: http://zitadel:8080
      ZITADEL_EXTERNAL_ISSUER: http://localhost:8080
      ZITADEL_MANAGEMENT_URL: http://zitadel:8080
      ZITADEL_CONSOLE_CLIENT_ID: ""
      PAT_FILE: /zitadel/bootstrap/admin.pat
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks:
      - zitadel
    depends_on:
      zitadel:
        condition: service_healthy

networks:
  zitadel:
    name: zitadel

volumes:
  postgres-data:
  zitadel-bootstrap:
