<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1 id="dashTitle">Welcome!</h1>
      <p class="subtitle" id="roleLabel">Loading...</p>
      <div class="alert alert-success" id="successMsg" style="display:none"></div>
      <div style="margin-top:20px">
        <div class="form-group">
          <label>Display Name</label>
          <div style="padding:12px 16px;background:#0f1419;border:1px solid #2a3a4a;border-radius:8px;color:#e1e8ed" id="infoName">-</div>
        </div>
        <div class="form-group">
          <label>Login Name</label>
          <div style="padding:12px 16px;background:#0f1419;border:1px solid #2a3a4a;border-radius:8px;color:#e1e8ed" id="infoLogin">-</div>
        </div>
        <div class="form-group">
          <label>Role</label>
          <div style="padding:12px 16px;background:#0f1419;border:1px solid #2a3a4a;border-radius:8px;color:#e1e8ed;text-transform:capitalize" id="infoRole">-</div>
        </div>
      </div>
      <div style="margin-top:24px;display:grid;gap:12px">
        <a href="/bulk-upload" class="btn btn-primary" style="text-align:center;text-decoration:none">Bulk Upload Students</a>
        <a href="#" id="consoleLink" class="btn btn-secondary" style="text-align:center;text-decoration:none">Open ZITADEL Console</a>
        <a href="/logout" class="btn btn-secondary" style="text-align:center;text-decoration:none">Sign Out</a>
      </div>
    </div>
  </div>
  <script>
    (async () => {
      try {
        const r = await fetch('/api/me');
        const user = await r.json();
        document.getElementById('dashTitle').textContent = `Welcome, ${user.displayName || user.loginName}!`;
        document.getElementById('roleLabel').textContent = `Logged in as ${user.role}`;
        document.getElementById('infoName').textContent = user.displayName || '-';
        document.getElementById('infoLogin').textContent = user.loginName || '-';
        document.getElementById('infoRole').textContent = user.role || '-';
        const clientId = '387163800052170755';
        const loginHint = encodeURIComponent(user.loginName + '@zeroschool.localhost');
        document.getElementById('consoleLink').href = `http://localhost:8080/oauth/v2/authorize?client_id=${clientId}&response_type=code&scope=openid%20profile%20email&login_hint=${loginHint}&prompt=login&redirect_uri=${encodeURIComponent('http://localhost:8080/ui/console')}`;
        const sm = document.getElementById('successMsg');
        sm.textContent = 'Account created successfully! You are now signed in.';
        sm.style.display = 'block';
      } catch (e) {
        window.location.href = '/login';
      }
    })();
  </script>
</body>
</html>
