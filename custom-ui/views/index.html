<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1>Welcome</h1>
      <p class="subtitle">Choose your role to get started</p>
      <div class="role-grid">
        <a href="/register/student" class="role-card">
          <span class="icon">🎓</span>
          <span class="label">Student</span>
        </a>
        <a href="/register/teacher" class="role-card">
          <span class="icon">👨‍🏫</span>
          <span class="label">Teacher</span>
        </a>
      </div>
      <div class="divider"><span>or</span></div>
      <a href="/login" class="btn btn-secondary" style="display:block;text-align:center;text-decoration:none;">Login to Existing Account</a>
    </div>
  </div>
</body>
</html>
