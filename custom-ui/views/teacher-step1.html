<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Registration - ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1>Teacher Registration</h1>
      <p class="subtitle">Fill in your details</p>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>

      <div id="error" class="alert alert-error" style="display:none"></div>

      <form id="step1Form" onsubmit="return false;">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="Enter first name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Enter last name" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 XXXXXXXXXX" required>
          </div>
          <div class="form-group">
            <label>School</label>
            <select id="schoolId" required>
              <option value="">Select school</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" onclick="goStep2()">Next →</button>
      </form>
      <div class="back-link"><a href="/">← Back</a></div>
    </div>
  </div>
  <script>
    async function loadSchools() {
      const schools = await fetch('/api/schools').then(r => r.json());
      const schoolSel = document.getElementById('schoolId');
      schools.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.id} - ${s.name}`;
        schoolSel.appendChild(opt);
      });
    }
    loadSchools();

    function goStep2() {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const schoolId = document.getElementById('schoolId').value;

      if (!firstName || !lastName || !phone || !schoolId) {
        const err = document.getElementById('error');
        err.textContent = 'Please fill all required fields';
        err.style.display = 'block';
        return;
      }

      const params = new URLSearchParams({ firstName, lastName, phone, schoolId });
      window.location.href = '/register/teacher/step2?' + params.toString();
    }
  </script>
</body>
</html>
