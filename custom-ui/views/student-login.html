<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1>Student Login</h1>
      <p class="subtitle">Sign in to your student account</p>
      <div id="error" class="alert alert-error" style="display:none"></div>
      <form onsubmit="return false;">
        <div class="form-group">
          <label>Username or Email</label>
          <input type="text" id="loginName" placeholder="e.g. stpriya9asch002" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn" onclick="doLogin()">Sign In</button>
      </form>
      <div class="divider"><span>new here?</span></div>
      <a href="/register" class="btn btn-secondary" style="display:block;text-align:center;text-decoration:none;">Create Student Account</a>
    </div>
  </div>
  <script>
    async function doLogin() {
      const err = document.getElementById('error');
      err.style.display = 'none';
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginName: document.getElementById('loginName').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await resp.json();
        if (data.success) {
          window.location.href = data.redirect || '/dashboard';
        } else {
          err.textContent = data.error || 'Login failed';
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = 'Network error. Please try again.';
        err.style.display = 'block';
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
    document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('loginName').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
