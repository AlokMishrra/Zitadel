<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1>Student Registration</h1>
      <p class="subtitle">Fill in your details</p>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>

      <div id="error" class="alert alert-error" style="display:none"></div>

      <form id="step1Form" onsubmit="return false;">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="Enter first name" required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Enter last name (optional)">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Class</label>
            <select id="className" required>
              <option value="">Select class</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 XXXXXXXXXX" required>
          </div>
        </div>
        <div class="form-group">
          <label>School</label>
          <select id="schoolId" required>
            <option value="">Select school</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" onclick="goStep2()">Next →</button>
      </form>
      <div class="back-link"><a href="/">← Back</a></div>
    </div>
  </div>
  <script>
    async function loadOptions() {
      const [schools, classes] = await Promise.all([
        fetch('/api/schools').then(r => r.json()),
        fetch('/api/classes').then(r => r.json())
      ]);
      const schoolSel = document.getElementById('schoolId');
      schools.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        schoolSel.appendChild(opt);
      });
      const classSel = document.getElementById('className');
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `Class ${c}`;
        classSel.appendChild(opt);
      });
    }
    loadOptions();

    function goStep2() {
      const firstName = document.getElementById('firstName').value.trim();
      const className = document.getElementById('className').value;
      const schoolId = document.getElementById('schoolId').value;
      const phone = document.getElementById('phone').value.trim();
      const lastName = document.getElementById('lastName').value.trim();

      if (!firstName || !className || !schoolId || !phone) {
        const err = document.getElementById('error');
        err.textContent = 'Please fill all required fields';
        err.style.display = 'block';
        return;
      }

      const params = new URLSearchParams({ firstName, className, schoolId, phone });
      if (lastName) params.set('lastName', lastName);
      window.location.href = '/register/student/step2?' + params.toString();
    }
  </script>
</body>
</html>
