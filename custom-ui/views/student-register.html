<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - ZeroSchool</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .school-option-text { font-size: 0.9em; }
    .school-location { font-size: 0.85em; color: #666; }
    select { max-width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-text"><span>ZeroSchool</span></div>
      <h1>Student Registration</h1>
      <p class="subtitle">Fill in your details — your email will be auto-generated</p>
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>
      <div id="error" class="alert alert-error" style="display:none"></div>
      <form onsubmit="return false;">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="e.g. Priya" required>
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="e.g. Sharma">
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="+91 XXXXXXXXXX" required>
        </div>
        <div class="form-group">
          <label>School</label>
          <select id="schoolId" required>
            <option value="">Loading schools...</option>
          </select>
          <small id="schoolError" style="color: red; display: none;"></small>
        </div>
        <div class="form-group">
          <label>Class</label>
          <select id="className" required>
            <option value="">Select class</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" onclick="goStep2()">Next</button>
      </form>
    </div>
  </div>
  <script>
    async function loadOptions() {
      try {
        const schoolSelect = document.getElementById('schoolId');
        const classSelect = document.getElementById('className');
        const schoolError = document.getElementById('schoolError');
        
        // Load schools
        const schoolsResp = await fetch('/api/schools');
        if (!schoolsResp.ok) throw new Error(`Schools API returned ${schoolsResp.status}`);
        const schools = await schoolsResp.json();
        
        if (!Array.isArray(schools) || schools.length === 0) {
          throw new Error('No schools received from server');
        }
        
        // Clear loading option
        schoolSelect.innerHTML = '<option value="">Select school</option>';
        
        // Add schools with location info
        schools.forEach(s => {
          const option = document.createElement('option');
          option.value = s.id;
          option.textContent = `${s.name} (${s.location || 'N/A'})`;
          schoolSelect.appendChild(option);
        });
        
        console.log(`✓ Loaded ${schools.length} schools`);
        
        // Load classes
        const classesResp = await fetch('/api/classes');
        if (!classesResp.ok) throw new Error(`Classes API returned ${classesResp.status}`);
        const classes = await classesResp.json();
        
        classSelect.innerHTML = '<option value="">Select class</option>';
        classes.forEach(c => {
          const option = document.createElement('option');
          option.value = c;
          option.textContent = 'Class ' + c;
          classSelect.appendChild(option);
        });
        
      } catch (err) {
        console.error('Error loading options:', err);
        const schoolSelect = document.getElementById('schoolId');
        const schoolError = document.getElementById('schoolError');
        schoolSelect.innerHTML = '<option value="">Error loading schools</option>';
        schoolError.textContent = `⚠️ Error: ${err.message}`;
        schoolError.style.display = 'block';
      }
    }
    
    loadOptions();

    function goStep2() {
      const f = document.getElementById('firstName').value.trim();
      const l = document.getElementById('lastName').value.trim();
      const p = document.getElementById('phone').value.trim();
      const s = document.getElementById('schoolId').value;
      const c = document.getElementById('className').value;
      if (!f || !p || !s || !c) {
        const e = document.getElementById('error');
        e.textContent = 'Please fill all required fields';
        e.style.display = 'block';
        return;
      }
      const params = new URLSearchParams({ firstName: f, className: c, schoolId: s, phone: p });
      if (l) params.set('lastName', l);
      window.location.href = '/register/step2?' + params.toString();
    }
  </script>
</body>
</html>
